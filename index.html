
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approach Control</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#000;color:#eee;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden
}
#app{display:flex;width:100vw;height:100vh}
#panel{
  width:456px;min-width:456px;height:100vh;
  background:#555;border-right:2px solid #111;
  display:flex;flex-direction:column;z-index:5
}
.top-buttons{
  height:120px;display:grid;
  grid-template-columns:repeat(3,1fr)
}
button{
  border:1px solid #000;background:#126477;
  color:#f1f1f1;font-weight:bold;
  font-size:19px;cursor:pointer;
  font-family:Arial,sans-serif
}
button:hover{background:#197d91}
button:active{background:#0a5364}
button.active{background:#05056c}
button:disabled{opacity:.45;cursor:not-allowed}
.mid-buttons{
  display:grid;grid-template-columns:1fr 1fr;
  height:120px
}
.mid-buttons button{font-size:21px}
.speed-buttons{
  display:grid;grid-template-columns:1fr .7fr 1fr;
  height:120px
}
.speed-buttons button{font-size:21px}
#instruction-panel{
  flex:1;background:#555;position:relative;
  padding:18px 0;min-height:0
}
.instruction{
  width:100%;height:76px;display:flex;
  align-items:center;padding:0 24px;
  gap:18px;font-size:20px;font-weight:bold;
  cursor:pointer
}
.instruction:hover{background:#666}
.instruction.selected{background:#646464}
.instruction .arrow{
  background:#05056c;border-radius:22px;
  width:100px;height:96px;display:flex;
  align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0
}
.instruction .value{
  text-decoration:underline;text-decoration-thickness:3px;
  text-underline-offset:5px
}
#edit-route{
  position:absolute;right:0;top:18px;
  width:86px;height:142px;line-height:1.5
}
#route-list{
  margin-top:10px;padding:0 28px;
  display:flex;flex-direction:column;gap:10px
}
.route-point{
  height:72px;display:flex;align-items:center;
  gap:24px;font-size:19px;font-weight:bold;
  cursor:pointer
}
.route-point:hover{background:#666}
.route-point .alt{
  text-decoration:underline;text-decoration-thickness:3px;
  text-underline-offset:5px
}
#bottom-buttons{
  height:120px;display:grid;
  grid-template-columns:1fr 1fr 1fr
}
#bottom-buttons button{font-size:20px}
#bottom-buttons .spacer{background:#555}
#radar{
  flex:1;position:relative;overflow:hidden;
  background:#000
}
canvas{width:100%;height:100%;display:block}
#statusbar{
  position:absolute;bottom:0;left:0;right:0;
  height:27px;background:#111c;
  border-top:1px solid #333;
  display:flex;align-items:center;
  padding:0 12px;gap:22px;
  color:#aaa;font-size:11px;
  letter-spacing:1px
}
#clock{margin-left:auto;color:#ddd}
#toast{
  position:absolute;top:15px;right:18px;
  background:#111;border:1px solid #168ca6;
  padding:10px 16px;font-size:13px;
  color:#ddd;display:none;z-index:10
}
#dialog{
  display:none;position:absolute;z-index:20;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:340px;background:#555;
  border:2px solid #111;padding:20px;
  box-shadow:0 8px 40px #000
}
#dialog h3{margin:0 0 16px}
#dialog input,#dialog select{
  width:100%;padding:10px;margin:7px 0 14px;
  background:#222;color:white;border:1px solid #888;
  font-size:16px
}
.dialog-actions{display:flex;gap:8px}
.dialog-actions button{height:45px;flex:1}
#dialog label{font-size:13px;color:#ddd}
@media(max-width:800px){
  #panel{width:340px;min-width:340px}
  .instruction{font-size:16px;padding-left:12px}
  .instruction .arrow{width:70px}
  #edit-route{width:65px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="top-buttons">
      <button id="routeBtn" class="active" onclick="chooseMode('route')">Route</button>
      <button id="holdBtn" onclick="command('hold')">Hold</button>
      <button id="vectorsBtn" onclick="chooseMode('vectors')">Vectors</button>
    </div>

    <div class="mid-buttons">
      <button onclick="setApproach('RNP 02R')">RNP 02R</button>
      <button onclick="command('vectors')">Via vectors</button>
    </div>

    <div class="speed-buttons">
      <button onclick="changeAltitude(-1000)">1000</button>
      <button onclick="command('expedite')">Expedite</button>
      <button onclick="changeSpeed(10)">210</button>
    </div>

    <section id="instruction-panel">
      <div class="instruction selected" onclick="selectInstruction(this)">
        <div class="arrow">=&gt;</div>
        <span id="selectedCallsign">Select aircraft</span>
        <span class="value" id="selectedAltitude">----</span>
        <span id="selectedSpeed">---</span>
        <button id="edit-route" onclick="event.stopPropagation();openDialog()">Edit<br>route</button>
      </div>

      <div id="route-list">
        <div class="route-point" onclick="selectWaypoint('VULUV')">
          <span>VULUV</span><span class="alt">1700</span>
        </div>
        <div class="route-point" onclick="selectWaypoint('SOPMI')">
          <span>SOPMI</span><span class="alt">1000</span>
        </div>
        <div class="route-point" onclick="command('missed')">
          <span>Missed approach</span>
        </div>
        <div class="route-point" onclick="selectWaypoint('RW02R')">
          <span>RW02R</span>
        </div>
        <div class="route-point" onclick="selectWaypoint('GOODI')">
          <span>GOODI</span><span class="alt">2000</span>
        </div>
      </div>
    </section>

    <div id="bottom-buttons">
      <button onclick="undoAll()">Undo all</button>
      <div class="spacer"></div>
      <button onclick="transmit()">Transmit</button>
    </div>
  </aside>

  <main id="radar">
    <canvas id="map"></canvas>
    <div id="toast"></div>
    <div id="statusbar">
      <span>APPROACH CONTROL</span>
      <span id="frequency">119.300</span>
      <span id="trafficCount">TRAFFIC 5</span>
      <span id="clock">00:00:00</span>
    </div>
  </main>
</div>

<div id="dialog">
  <h3>EDIT ROUTE</h3>
  <label>Aircraft</label>
  <input id="editCallsign" disabled>
  <label>Waypoint</label>
  <select id="editWaypoint">
    <option>VULUV</option>
    <option>SOPMI</option>
    <option>RW02R</option>
    <option>GOODI</option>
    <option>MENNU</option>
    <option>KAYPO</option>
  </select>
  <label>Assigned altitude</label>
  <input id="editAltitude" type="number" value="3000">
  <div class="dialog-actions">
    <button onclick="saveRoute()">Save</button>
    <button onclick="closeDialog()">Cancel</button>
  </div>
</div>

<script>
const canvas=document.getElementById("map");
const ctx=canvas.getContext("2d");

let W=0,H=0;
let mode="route";
let selected=null;
let pending=[];
let messages=[];
let lastTime=performance.now();
let elapsed=0;

const waypoints={
  VULUV:{x:.53,y:.42},
  SOPMI:{x:.60,y:.33},
  RW02R:{x:.65,y:.25},
  GOODI:{x:.78,y:.12},
  MENNU:{x:.39,y:.65},
  KAYPO:{x:.46,y:.52}
};

const aircraft=[
 {id:"UAL240",type:"B738",x:.18,y:.73,alt:3500,speed:190,heading:35,color:"#00cfff",route:["MENNU","KAYPO","VULUV"],status:"Established"},
 {id:"SIA959",type:"B772/H/B",x:.34,y:.64,alt:10000,speed:215,heading:35,color:"#00cfff",route:["KAYPO","VULUV","SOPMI"],status:"Descending"},
 {id:"KLM501",type:"B77W/H/B",x:.57,y:.80,alt:17000,speed:250,heading:310,color:"#00cfff",route:["GOODI","SOPMI"],status:"En route"},
 {id:"TGV949",type:"A319/M/D",x:.83,y:.90,alt:7000,speed:250,heading:300,color:"#00cfff",route:["GOODI","VULUV"],status:"En route"},
 {id:"ALK71",type:"B738",x:.64,y:.24,alt:1130,speed:150,heading:210,color:"#00cfff",route:["RW02R"],status:"Approach"}
];

function resize(){
 const r=canvas.getBoundingClientRect();
 const dpr=window.devicePixelRatio||1;
 canvas.width=r.width*dpr;
 canvas.height=r.height*dpr;
 W=r.width;H=r.height;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function px(x){return x*W}
function py(y){return y*H}

function line(x1,y1,x2,y2,color,width=1){
 ctx.beginPath();ctx.moveTo(px(x1),py(y1));
 ctx.lineTo(px(x2),py(y2));
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}

function drawTerrain(){
 ctx.strokeStyle="#704000";
 ctx.lineWidth=.7;
 for(let i=0;i<95;i++){
   let x=(i*73%997)/1000;
   let y=(i*137%997)/1000;
   let size=.008+(i%5)*.002;
   ctx.beginPath();
   ctx.moveTo(px(x),py(y));
   ctx.lineTo(px(x+size),py(y-size*.5));
   ctx.lineTo(px(x+size*1.5),py(y+size*.4));
   ctx.lineTo(px(x+size*.5),py(y+size));
   ctx.closePath();ctx.stroke();
 }
 // Larger terrain contours
 for(let j=0;j<9;j++){
   let x=(j*.137+.08)%1;
   let y=(j*.213+.1)%1;
   ctx.beginPath();
   for(let k=0;k<12;k++){
     let a=k/12*Math.PI*2;
     let rx=.035+(j%3)*.015;
     let ry=.025+(j%4)*.009;
     let xx=x+Math.cos(a)*rx*(1+.18*Math.sin(a*3+j));
     let yy=y+Math.sin(a)*ry*(1+.15*Math.cos(a*4));
     if(k===0)ctx.moveTo(px(xx),py(yy));
     else ctx.lineTo(px(xx),py(yy));
   }
   ctx.closePath();ctx.stroke();
 }
}

function drawAirport(){
 // Runway complex
 ctx.save();
 ctx.translate(px(.66),py(.25));
 ctx.rotate(-.42);
 ctx.strokeStyle="#aaa";ctx.lineWidth=1;
 ctx.strokeRect(-18,-80,36,160);
 ctx.strokeStyle="#666";
 ctx.strokeRect(-13,-74,26,148);
 ctx.beginPath();ctx.moveTo(0,-68);ctx.lineTo(0,68);ctx.stroke();
 for(let i=-5;i<=5;i++){
   ctx.fillStyle="#bbb";
   ctx.fillRect(-7,i*12-1,14,2);
 }
 ctx.restore();
 ctx.fillStyle="#aaa";ctx.font="11px Arial";
 ctx.fillText("RW02R",px(.63),py(.25));
 ctx.fillText("AIRPORT",px(.67),py(.29));
}

function drawWaypoint(name,p){
 const x=px(p.x),y=py(p.y);
 ctx.fillStyle="#aaa";ctx.font="10px Arial";
 ctx.fillText(name,x+7,y-6);
 ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);
 ctx.strokeStyle="#777";ctx.stroke();
}

function drawRange(){
 ctx.beginPath();
 ctx.arc(px(.63),py(.22),Math.min(W,H)*.19,0,Math.PI*2);
 ctx.strokeStyle="#666";ctx.lineWidth=1;ctx.stroke();
 ctx.beginPath();ctx.arc(px(.13),py(.30),31,0,Math.PI*2);
 ctx.strokeStyle="#b68a00";ctx.stroke();
 ctx.fillStyle="#d9a400";ctx.font="bold 13px Arial";
 ctx.fillText("100",px(.13)-13,py(.30)+4);
}

function drawRoute(p){
 if(!p.route.length)return;
 let last={x:p.x,y:p.y};
 for(const name of p.route){
   const wp=waypoints[name];
   if(!wp)continue;
   line(last.x,last.y,wp.x,wp.y,"#00a7c8",.8);
   line(last.x+.002,last.y+.002,wp.x+.002,wp.y+.002,"#00a52b",1.1);
   last=wp;
 }
}

function drawAircraft(p){
 const x=px(p.x),y=py(p.y);
 // route lines first
 ctx.strokeStyle=p===selected?"#00eaff":"#00a52b";
 ctx.lineWidth=p===selected?2:1;
 ctx.beginPath();ctx.moveTo(x,y);
 ctx.lineTo(x-Math.sin(p.heading*Math.PI/180)*24,
            y+Math.cos(p.heading*Math.PI/180)*24);
 ctx.stroke();

 ctx.fillStyle=p===selected?"#ffff00":"#00cfff";
 ctx.fillRect(x-6,y-6,12,12);
 ctx.strokeStyle=p===selected?"#ffff00":"#00cfff";
 ctx.lineWidth=1.5;ctx.strokeRect(x-8,y-8,16,16);

 // Aircraft data tag
 const labelW=110,labelH=47;
 let lx=x+14,ly=y-60;
 if(lx+labelW>W)lx=x-labelW-15;
 if(ly<2)ly=y+15;
 ctx.fillStyle="#000";
 ctx.fillRect(lx,ly,labelW,labelH);
 ctx.strokeStyle=p===selected?"#00eaff":"#00cfff";
 ctx.lineWidth=2;ctx.strokeRect(lx,ly,labelW,labelH);
 ctx.fillStyle="#eee";
 ctx.font="bold 14px Arial";
 ctx.fillText(p.id,lx+5,ly+17);
 ctx.font="14px Arial";
 ctx.fillText(p.alt+"  "+p.speed,lx+5,ly+35);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
 drawTerrain();
 drawAirport();
 drawRange();

 Object.entries(waypoints).forEach(([n,p])=>drawWaypoint(n,p));

 aircraft.forEach(p=>drawRoute(p));
 aircraft.forEach(drawAircraft);

 // Small radar blips
 for(let i=0;i<28;i++){
   let x=(i*83%997)/1000;
   let y=(i*47%997)/1000;
   ctx.fillStyle="#00a9d4";
   ctx.fillRect(px(x),py(y),2,2);
 }
 requestAnimationFrame(draw);
}

function chooseMode(m){
 mode=m;
 document.getElementById("routeBtn").classList.toggle("active",m==="route");
 document.getElementById("vectorsBtn").classList.toggle("active",m==="vectors");
 notify(m==="route"?"Route mode selected":"Vector mode selected");
}

function selectPlane(p){
 selected=p;
 pending=[];
 document.getElementById("selectedCallsign").textContent=p.id;
 document.getElementById("selectedAltitude").textContent=p.alt;
 document.getElementById("selectedSpeed").textContent=p.speed+"kts";
 document.getElementById("editCallsign").value=p.id;
 notify("Selected "+p.id);
}

canvas.addEventListener("click",e=>{
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)/W;
 const y=(e.clientY-r.top)/H;
 let closest=null,dist=.025;
 for(const p of aircraft){
   let d=Math.hypot(p.x-x,p.y-y);
   if(d<dist){dist=d;closest=p}
 }
 if(closest){selectPlane(closest);return}
 if(selected && (mode==="route"||mode==="vectors")){
   let nearest=null,best=.06;
   for(const [name,wp] of Object.entries(waypoints)){
     let d=Math.hypot(wp.x-x,wp.y-y);
     if(d<best){best=d;nearest=name}
   }
   if(nearest){
     pending.push(nearest);
     notify(nearest+" added to route");
   }
 }
});

function command(type){
 if(!selected){notify("Select an aircraft first");return}
 if(type==="hold"){
   selected.route=[];
   selected.status="Holding";
   log(selected.id+" instructed to hold");
   notify(selected.id+" holding");
 }
 if(type==="vectors"){
   selected.route=[];
   selected.status="Vectors";
   log(selected.id+" instructed via vectors");
   notify("Vector instructions ready");
 }
 if(type==="expedite"){
   selected.speed=Math.min(320,selected.speed+20);
   updateSelected();
   log(selected.id+" expedite");
   notify("Speed increased");
 }
 if(type==="missed"){
   selected.route=["GOODI","MENNU"];
   selected.status="Missed approach";
   selected.alt=Math.max(selected.alt,3000);
   updateSelected();
   log(selected.id+" missed approach");
   notify("Missed approach assigned");
 }
}

function setApproach(name){
 if(!selected){notify("Select an aircraft first");return}
 selected.route=["VULUV","SOPMI","RW02R"];
 selected.status=name;
 log(selected.id+" cleared for "+name);
 notify(name+" assigned");
}

function selectWaypoint(name){
 if(!selected){notify("Select an aircraft first");return}
 pending.push(name);
 notify(name+" added to pending route");
}

function changeAltitude(delta){
 if(!selected){notify("Select an aircraft first");return}
 selected.alt=Math.max(0,selected.alt+delta);
 updateSelected();
 log(selected.id+" altitude "+selected.alt);
}
function changeSpeed(delta){
 if(!selected){notify("Select an aircraft first");return}
 selected.speed=Math.max(100,Math.min(320,selected.speed+delta));
 updateSelected();
 log(selected.id+" speed "+selected.speed);
}
function updateSelected(){
 if(!selected)return;
 document.getElementById("selectedAltitude").textContent=selected.alt;
 document.getElementById("selectedSpeed").textContent=selected.speed+"kts";
}

function openDialog(){
 if(!selected){notify("Select an aircraft first");return}
 document.getElementById("editCallsign").value=selected.id;
 document.getElementById("editAltitude").value=selected.alt;
 document.getElementById("dialog").style.display="block";
}
function closeDialog(){
 document.getElementById("dialog").style.display="none";
}
function saveRoute(){
 if(!selected)return;
 let wp=document.getElementById("editWaypoint").value;
 let alt=Number(document.getElementById("editAltitude").value);
 if(!Number.isFinite(alt)||alt<0){notify("Enter a valid altitude");return}
 selected.route=[wp];
 selected.alt=alt;
 selected.status="Route amended";
 updateSelected();
 log(selected.id+" route amended direct "+wp);
 closeDialog();
 notify("Route updated");
}

function transmit(){
 if(!selected){notify("Select an aircraft first");return}
 if(pending.length){
   selected.route=[...pending];
   selected.status="Route assigned";
   log(selected.id+" cleared direct "+pending.join(" then "));
   pending=[];
   notify("Route transmitted to "+selected.id);
 }else{
   log(selected.id+" instruction transmitted");
   notify("Instruction transmitted");
 }
}

function undoAll(){
 if(!selected){notify("Select an aircraft first");return}
 pending=[];
 selected.route=[];
 selected.status="No route";
 notify("Pending route cleared");
}

function selectInstruction(el){
 document.querySelectorAll(".instruction").forEach(x=>x.classList.remove("selected"));
 el.classList.add("selected");
}

function notify(message){
 const t=document.getElementById("toast");
 t.textContent=message;t.style.display="block";
 clearTimeout(notify.timer);
 notify.timer=setTimeout(()=>t.style.display="none",2300);
}

function log(message){
 messages.push({time:new Date().toLocaleTimeString(),message});
 console.log("ATC:",message);
}

function updateClock(){
 elapsed++;
 const h=String(Math.floor(elapsed/3600)).padStart(2,"0");
 const m=String(Math.floor(elapsed/60)%60).padStart(2,"0");
 const s=String(elapsed%60).padStart(2,"0");
 document.getElementById("clock").textContent=h+":"+m+":"+s;
}
setInterval(updateClock,1000);

document.getElementById("trafficCount").textContent="TRAFFIC "+aircraft.length;

draw();
</script>
</body>
</html>
